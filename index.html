<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genre Popularity</title>
<style>
  /* Taken from square.github.io/crossfilter */
  :root { color-scheme: light; --bg: #fff; --fg: #333; --muted: #777; }
  body { background: var(--bg); color: var(--fg); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; }
  .wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 48px; }
  h1 { font-size: 28px; font-weight: 300; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); max-width: 70ch; line-height: 1.5; }
  #source { font-size: 12px; margin-bottom: 20px; }
  #vis, #bars { overflow-x: auto; }
  #yearPicker { margin: 32px 0 10px; font-size: 13px; }
  #yearPicker select { font: inherit; font-size: 13px; padding: 3px 6px; margin-left: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Genre Popularity</h1>
  <p id="source"></p>
  <div id="vis"></div>
  <div id="yearPicker"></div>
  <div id="bars"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vega@5.25.0/build/vega.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5.16.3/build/vega-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6.22.2/build/vega-embed.min.js"></script>
<script>
/* ---------- 1. DATA: music.csv (CORGIS Million Song sample), one row per song ----------
   Kept per song: { artist, genre, year, artistPop, songPop }
   In this file a missing year is stored as 0 and a missing popularity as 0 or -1,
   so any value <= 0 is treated as missing (null). */

// detailed artist.terms -> broad genre. Checked top to bottom, first match wins,
// so "latin jazz" is Latin and "blues-rock" is Jazz / Blues. Edit to change the buckets.
const BUCKETS = [
  ["Latin / Reggae / World", /reggae|dancehall|lovers rock|ska|dub\b|salsa|latin|flamenco|bossa|samba|merengue|bachata|cumbia|tango|world|afro|chinese|mpb|zouk|calypso|soca|cuban|mariachi|ranchera|tejano|bolero|j-pop|k-pop|bhangra|fado|zydeco|soukous|charanga|rumba|gaita|greek/],
  ["Hip hop",        /hip ?hop|rap|crunk|grime|turntablism|turnablism/],
  ["Metal",          /metal|grindcore|death ?core/],
  ["Jazz / Blues",   /jazz|blues|swing|bebop|big band|ragtime|boogie/],
  ["Country / Folk", /country|folk|bluegrass|honky|americana|singer-songwriter|irish|celtic|western/],
  ["Electronic",     /house|techno|trance|electro|chill|trip hop|ambient|downtempo|drum and bass|breakbeat|idm|dubstep|eurodance|jungle|hardstyle|gabba|garage|big beat|synth|alternative dance|ghetto tech|bass music|freestyle/],
  ["R&B / Soul",     /r&b|rnb|soul|funk|motown|disco|gospel|quiet storm|new jack|doo-wop/],
  ["Pop",            /pop|chanson|easy listening|ballad|schlager|cabaret|crooner|vocal|ccm/],
  ["Rock",           /rock|punk|grunge|indie|emo|hardcore|new wave|shoegaze|post-|psychedelic|surf|rockabilly|mod\b|screamo|\boi\b|freakbeat/],
];
const broadGenre = t => { t = String(t || "").toLowerCase(); for (const [g, re] of BUCKETS) if (re.test(t)) return g; return "Other"; };
const FIRST_YEAR = 1955;   // songs released before this are left out
const KEEP_GENRES = ["Pop", "Rock", "Country / Folk", "Hip hop", "Jazz / Blues"];

function prepare(raw) {
  const pos = v => (typeof v === "number" && v > 0) ? v : null;   // 0 / blank -> missing
  const rows = raw.map(r => ({
    artist: String(r["artist.id"]),
    genre: broadGenre(r["artist.terms"]),
    year: pos(r["song.year"]),
    artistPop: pos(r["artist.hotttnesss"]),
    songPop: pos(r["song.hotttnesss"]),
  }));
  // keep the 8 largest genres (one color each); fold the rest into "Other"
  const n = {}; rows.forEach(r => n[r.genre] = (n[r.genre] || 0) + 1);
  const keep = new Set(Object.keys(n).filter(g => g !== "Other").sort((a, b) => n[b] - n[a]).slice(0, 8));
  rows.forEach(r => { if (!keep.has(r.genre)) r.genre = "Other"; });
  return rows.filter(r => (r.year === null || r.year >= FIRST_YEAR) && KEEP_GENRES.includes(r.genre));}

/* ---------- 2. THE SPEC: every chart filters by every brush ---------- */
const GREY = "#ccc", BLUE = "#4682b4";
const ALL_FILTERS = "true";   // no filtering: every chart shows all songs
// one fixed color per genre, assigned in order (never re-colored when filters change)
const PALETTE = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"];

function buildSpec(rows) {
  const counts = {};
  rows.forEach(r => counts[r.genre] = (counts[r.genre] || 0) + 1);
  const genreOrder = Object.keys(counts).filter(g => g !== "Other").sort((a, b) => counts[b] - counts[a])
                       .concat(counts.Other ? ["Other"] : []);
  const genreColor = { field: "genre", type: "nominal", title: "Genre",
    scale: { domain: genreOrder, range: genreOrder.map((g, i) => g === "Other" ? "#999" : PALETTE[i]) } };
  const x = { field: "year", type: "quantitative", title: "Release year", axis: { format: "d" }, scale: { nice: false } };

  // One genre-by-year line chart. `agg` turns song rows into one row per genre + year.
  function genreLines(title, agg, y, tip, brush) {
    const greyLayer = { transform: agg, mark: { type: "line", strokeWidth: 1, color: "#e2e2e2" },
                        encoding: { x, y, detail: { field: "genre" } } };
    if (brush) greyLayer.params = [{ name: brush, select: { type: "interval", encodings: ["x"] } }];
    return {
      title, width: 640, height: 200,
      layer: [
        greyLayer,                                                                     // grey: full sample
        { transform: [{ filter: ALL_FILTERS }, ...agg],                                // colored: filtered
          mark: { type: "line", strokeWidth: 2 }, encoding: { x, y, color: genreColor } },
        { transform: [{ filter: ALL_FILTERS }, ...agg],                                // points you hover
          mark: { type: "point", filled: true, size: 30 },
          encoding: { x, y, color: genreColor,
            tooltip: [ { field: "genre", title: "Genre" }, { field: "year", title: "Release year" }, tip ] } },
      ],
    };
  }

  // Sheet 2: unique artists per genre per year (each artist counted once per year)
  const artistCount = genreLines(
    "Unique artists per genre by release year",
    [ { filter: "isValid(datum.year)" },
      { aggregate: [{ op: "distinct", field: "artist", as: "artists" }], groupby: ["genre", "year"] } ],
    { field: "artists", type: "quantitative", title: "Unique artists", axis: { tickCount: 4 } },
    { field: "artists", title: "Unique artists" },
    null);

  // Sheet 3: average artist.hotttnesss per genre per year
  // (average per artist first, so an artist with many songs still counts once)
  const artistHotness = genreLines(
    "Average artist popularity (artist.hotttnesss) per genre by release year",
    [ { filter: "isValid(datum.year) && isValid(datum.artistPop)" },
      { aggregate: [{ op: "mean", field: "artistPop", as: "artistPop" }], groupby: ["genre", "year", "artist"] },
      { aggregate: [{ op: "mean", field: "artistPop", as: "hotness" }], groupby: ["genre", "year"] } ],
    { field: "hotness", type: "quantitative", title: "Average artist.hotttnesss", scale: { domain: [0, 1] }, axis: { format: ".1f", tickCount: 5 } },
    { field: "hotness", title: "Avg. artist.hotttnesss", format: ".3f" },
    null);

  // Sheet 2, option 2: one bar per genre for the year picked in the dropdown,
  // a dashed "ghost bar" for the year before, and an arrow for the direction of change
  const songsPerYear = {}; rows.forEach(r => { if (r.year) songsPerYear[r.year] = (songsPerYear[r.year] || 0) + 1; });
  const yearOptions = Object.keys(songsPerYear).map(Number).sort((a, b) => a - b);
  const startYear = yearOptions.reduce((a, b) => songsPerYear[b] > songsPerYear[a] ? b : a);  // busiest year
  const xBar = { type: "quantitative", title: "Unique artists", axis: { tickMinStep: 1 } };
  const yBar = { field: "genre", type: "nominal", sort: genreOrder, title: null, scale: { domain: genreOrder },
                 axis: { ticks: false, domain: false, labelColor: "#333", labelFontSize: 11, labelLimit: 220 } };
  const yearBars = {
    title: { text: { expr: "'Unique artists per genre in ' + pickYear + ' vs. ' + (pickYear - 1)" } },
    width: 640, height: { step: 24 },
    transform: [
      { filter: "datum.year === pickYear || datum.year === pickYear - 1" },
      { aggregate: [{ op: "distinct", field: "artist", as: "artists" }], groupby: ["genre", "year"] },
      { calculate: "datum.year === pickYear ? 'cur' : 'prev'", as: "period" },
      { pivot: "period", value: "artists", groupby: ["genre"] },                        // -> cur, prev per genre
      { calculate: "isValid(datum.cur) ? datum.cur : 0", as: "cur" },
      { calculate: "isValid(datum.prev) ? datum.prev : 0", as: "prev" },
      { calculate: "datum.cur > datum.prev ? 'up' : datum.cur < datum.prev ? 'down' : 'same'", as: "dir" },
      { calculate: "(datum.dir === 'up' ? '▲ ' : datum.dir === 'down' ? '▼ ' : '= ') + datum.cur", as: "label" },
      { calculate: "max(datum.cur, datum.prev)", as: "labelX" },
    ],
    encoding: { y: yBar },
    layer: [
      { mark: { type: "bar", fillOpacity: 0, stroke: "#888", strokeDash: [3, 2], strokeWidth: 1.2, height: { band: 0.8 } },
        encoding: { x: { field: "prev", ...xBar } } },                                    // ghost bar: previous year
      { mark: { type: "bar", height: { band: 0.5 } },
        encoding: { x: { field: "cur", type: "quantitative" }, color: { ...genreColor, legend: null } } },  // this year
      { mark: { type: "text", align: "left", dx: 6, fontSize: 11 },
        encoding: { x: { field: "labelX", type: "quantitative" }, text: { field: "label" },
          color: { field: "dir", type: "nominal", legend: null,
                   scale: { domain: ["up", "down", "same"], range: ["#1d7a3e", "#c03b3a", "#777"] } } } },
    ],
    resolve: { scale: { color: "independent" } },   // arrow colors are separate from genre colors
  };

  const countLine = {
    width: 640, height: 22,
    transform: [
      { joinaggregate: [{ op: "count", as: "total" }] },
      { filter: ALL_FILTERS },
      { aggregate: [{ op: "count", as: "n" }, { op: "max", field: "total", as: "total" }] },
      { calculate: "format(datum.n, ',') + ' of ' + format(datum.total, ',') + ' songs selected'", as: "label" },
    ],
    mark: { type: "text", align: "left", baseline: "middle", fontSize: 15, color: "#333" },
    encoding: { text: { field: "label" }, x: { value: 0 }, y: { value: 11 } },
  };

  const config = {
    font: "Helvetica Neue, Helvetica, Arial, sans-serif",
    view: { stroke: null },
    title: { anchor: "start", fontSize: 13, fontWeight: "normal", color: "#333", offset: 8 },
    axis: { grid: false, labelColor: "#777", domainColor: "#999", tickColor: "#999", labelFontSize: 10 },
    legend: { labelLimit: 220 },
  };
  const schema = "https://vega.github.io/schema/vega-lite/v5.json";

  // the bar chart is a separate spec so its year dropdown can sit right above it
  const bars = {
    $schema: schema, data: { values: rows }, config,
    params: [{ name: "pickYear", value: startYear,
               bind: { input: "select", options: yearOptions, name: "Release year ", element: "#yearPicker" } }],
    ...yearBars,
  };

  const main = {
    $schema: "https://vega.github.io/schema/vega-lite/v5.json",
    data: { values: rows },
    vconcat: [
      artistCount,
      artistHotness,
    ],
    spacing: 28,
    config,
  };
  return { main, bars };
}

/* ---------- 3. LOAD music.csv AND DRAW ----------
   music.csv must sit in the same folder as this page. */
fetch("music.csv")
  .then(r => { if (!r.ok) throw new Error("music.csv not found (" + r.status + ")"); return r.text(); })
  .then(text => {
    const rows = prepare(vega.read(text, { type: "csv", parse: "auto" }));
    const noYear = rows.filter(r => !r.year).length;
    const { main, bars } = buildSpec(rows);
    return Promise.all([
      vegaEmbed("#vis", main, { actions: false, renderer: "svg" }),
      vegaEmbed("#bars", bars, { actions: false, renderer: "svg" }),
    ]);
  })
  .catch(err => {
    document.getElementById("source").textContent = "Could not load music.csv: " + err.message +
      ". Open this page through a local server (e.g. VS Code Live Server) with music.csv in the same folder.";
  });
</script>
</body>
</html>
